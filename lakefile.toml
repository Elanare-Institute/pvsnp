name = "directionalasymmetry"
defaultTargets = ["DirectionalAsymmetry", "Test"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "DirectionalAsymmetry"

[[lean_lib]]
name = "Test"

# v2 抽象層と Phase 0 の矛盾実証。デフォルトのビルド対象には含めない。
# 検証するには: lake build Legacy Phase0Test
[[lean_lib]]
name = "Legacy"

[[lean_lib]]
name = "Phase0Test"
srcDir = "Test"
roots = ["Phase0Inconsistency"]
